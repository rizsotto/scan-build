[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scan-build"
version = "3.1.0"
description = "Run the Clang static analyzer on projects with a compilation database."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "László Nagy", email = "rizsotto@gmail.com" }
]
keywords = ["Clang", "scan-build", "static analyzer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed"
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/rizsotto/scan-build"
Repository = "https://github.com/rizsotto/scan-build"
Issues = "https://github.com/rizsotto/scan-build/issues"

[project.scripts]
clanganalyzer = "clanganalyzer.analyze:analyze_build"
analyze-build = "clanganalyzer.analyze:analyze_build"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "lit>=18.0",
]
lint = [
    "ruff>=0.14",
    "ty>=0.0.69,<0.1",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.hatch.build.targets.wheel]
packages = ["clanganalyzer"]

[tool.hatch.build.targets.sdist]
include = [
    "/clanganalyzer",
    "/tests",
    "/README.rst",
    "/LICENSE.txt",
    "/CHANGES.txt",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["clanganalyzer"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--verbose"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["clanganalyzer"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
